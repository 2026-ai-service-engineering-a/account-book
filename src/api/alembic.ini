# 마이그레이션 설정. 접속 주소는 여기 적지 않는다 — env.py가 Settings에서 읽는다.
#
#   alembic -c src/api/alembic.ini upgrade head          # api가 뜰 때 알아서 한다
#   alembic -c src/api/alembic.ini revision --autogenerate -m "..."   # 만든 뒤 꼭 읽는다
[alembic]
script_location = %(here)s/infrastructure/db/migrations
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
