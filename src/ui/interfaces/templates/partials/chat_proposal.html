{% from "ai.html" import ai_badge %}
<div class="card-confirm" data-proposal-id="{{ proposal.id }}">
  <div class="card-confirm-head"><strong>이렇게 기록할게요</strong>{{ ai_badge("capture") }}</div>
  <p class="card-main">
    {{ proposal.occurred_on }} · {{ proposal.category_name }} ·
    <strong class="amount {{ 'in' if proposal.direction == 'income' else 'out' }}">{{ proposal.amount | signed(proposal.direction) }}</strong>
  </p>
  <p class="card-detail">{{ proposal.account_name }}{% if proposal.merchant %} · {{ proposal.merchant }}{% endif %}</p>
  <div class="actions">
    <button type="button" class="btn btn-outline btn-sm" data-decision="cancel">취소</button>
    <button type="button" class="btn btn-sm" data-decision="confirm">확인</button>
  </div>
</div>
