<section id="summary" {% if oob %}hx-swap-oob="true"{% endif %} class="stats">
  <div class="card" style="padding:20px 0"><div class="card-content stat">
    <span class="stat-label">지출 합</span><span class="stat-value amount out">{{ totals.expense | signed("expense") }}</span>
  </div></div>
  <div class="card" style="padding:20px 0"><div class="card-content stat">
    <span class="stat-label">수입 합</span><span class="stat-value amount in">{{ totals.income | signed("income") }}</span>
  </div></div>
</section>
