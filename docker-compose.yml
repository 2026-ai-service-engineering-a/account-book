# 기본 구성 — 운영처럼 뜬다. 코드를 이미지에 굽고, 고쳐도 다시 뜨지 않는다.
# 서비스 넷 — ui, agent, api, db(README 3장). 호스트로 여는 건 ui 하나뿐이다.
#
#   docker compose up -d --build   # http://localhost:8080
#
# 개발할 때는 docker-compose.dev.yml을 겹쳐 쓴다 — make up / make dev.
services:
  ui:
    build:
      context: .
      target: ui
    image: account-book-ui
    # .env를 통째로 넘기지 않는다. 거기에는 LLM 키와 DB 비밀번호가 있고, ui는 둘 다 몰라야 한다
    # (README 3장). 쓰는 것만 골라 넘긴다. 값은 compose가 .env에서 읽어 채우고, 없어도 뜬다.
    # API_BASE_URL이 비면 api 자리에, AGENT_BASE_URL이 비면 AI 자리에 대역이 선다.
    environment:
      USER_TIMEZONE: ${USER_TIMEZONE:-Asia/Seoul}
      API_BASE_URL: ${API_BASE_URL:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-10}
    ports:
      # 호스트로 여는 건 ui 하나뿐이다(README 3장). 지금은 api 자리에 대역이 선다.
      - "${UI_PORT:-8080}:8080"
    restart: unless-stopped

  # 에이전트 — LLM 키를 가진 유일한 서비스. 포트를 열지 않는다. ui만 compose 내부에서 부른다.
  # 키가 비어 있으면 뜨는 순간 죽는다. 그래도 ui는 돈다 — 한 줄로 채우기가 "지금은 읽을 수
  # 없어요"라고 답할 뿐이다(docs/ai/README.md 2장 원칙 8).
  agent:
    build:
      context: .
      target: agent
    image: account-book-agent
    # .env를 통째로 넘기지 않는다 — agent는 DB 접속 정보를 모른다(README 3장). LLM 키와
    # 카테고리 고르기의 설정, 그리고 api의 주소만 받는다.
    environment:
      AGENT_MODEL: ${AGENT_MODEL:-gemini/gemini-flash-lite-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-10}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_MAX_COST_USD: ${AGENT_MAX_COST_USD:-0.50}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL-gemini/gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CLASSIFY_MIN_CONFIDENCE: ${CLASSIFY_MIN_CONFIDENCE:-0.7}
      CLASSIFY_ABSTAIN_BELOW: ${CLASSIFY_ABSTAIN_BELOW:-0.25}
    expose:
      - "8001"
    restart: unless-stopped

  # 가계부 도메인의 단일 진실 공급원. DB에 붙는 유일한 서비스다. 뜰 때 스키마를 올리고 기준
  # 데이터를 맞춘다(개발용 구성은 비어 있으면 예시 거래까지 넣는다).
  # .env를 통째로 받지 않는다 — LLM 키를 몰라야 한다(docs/ai/README.md 3장).
  api:
    build:
      context: .
      target: api
    image: account-book-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-account}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 채운다}
      POSTGRES_DB: ${POSTGRES_DB:-account_book}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      USER_TIMEZONE: ${USER_TIMEZONE:-Asia/Seoul}
      AGENT_CONFIRM_THRESHOLD: ${AGENT_CONFIRM_THRESHOLD:-100000}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_VOTE_TEMPERATURE: ${RAG_VOTE_TEMPERATURE:-0.03}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  # PostgreSQL + pgvector. 확장이 든 이미지라 카테고리 고르기의 벡터 검색을 DB에서 한다.
  # 포트를 열지 않는다. 데이터는 볼륨에 남는다 — 지우려면 docker compose down -v.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-account}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 채운다}
      POSTGRES_DB: ${POSTGRES_DB:-account_book}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
